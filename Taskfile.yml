version: "3"

dotenv:
  - .env

vars:
  APP_DIR: msfs/PackageSources/VRChecklist
  COMPANION_SOLUTION: companion/VRChecklist.Companion.slnx
  COMPANION_PROBE_PROJECT: companion/src/VRChecklist.TransportProbe/VRChecklist.TransportProbe.csproj
  DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0
  HOST_UID:
    sh: id -u
  HOST_GID:
    sh: id -g
  COMPANION_STAGING_DIR: '{{default "/mnt/c/dev/msfs2024-vr-checklist-companion-staging" .VR_CHECKLIST_COMPANION_STAGING_DIR}}'
  COMPANION_INSTALL_DIR: '{{default "" .VR_CHECKLIST_COMPANION_INSTALL_DIR}}'
  STAGING_DIR: '{{default "/mnt/c/dev/msfs2024-vr-checklist-staging" .STAGING_DIR}}'
  MSFS_SDK_ROOT: '{{default "/mnt/c/MSFS 2024 SDK" .VR_CHECKLIST_MSFS_SDK_ROOT}}'
  COMMUNITY_DIR: '{{default "" .VR_CHECKLIST_COMMUNITY_DIR}}'
  RELEASE_DIR: '{{default "/mnt/c/dev/msfs2024-vr-checklist-releases" .VR_CHECKLIST_RELEASE_DIR}}'
  PROJECT_VERSION:
    sh: node scripts/release-package.mjs current-version
  BUILD_TIMESTAMP:
    sh: date -u +%Y%m%d%H%M%S
  # Same rule as the EFB app build: a release passes VR_CHECKLIST_VERSION,
  # every other build is marked as a development build.
  COMPANION_VERSION: '{{if .VR_CHECKLIST_VERSION}}{{.VR_CHECKLIST_VERSION}}{{else}}{{.PROJECT_VERSION}}-dev.{{.BUILD_TIMESTAMP}}{{end}}'

tasks:
  default:
    desc: List available project tasks
    cmds:
      - task --list

  init:
    desc: Create local, ignored workspace directories
    cmds:
      - mkdir -p tmp
    status:
      - test -d tmp

  install:
    desc: Install the locked EFB app dependencies
    dir: "{{.APP_DIR}}"
    cmds:
      - npm ci

  validate:
    desc: Validate all versioned checklist data
    cmds:
      - node scripts/validate-checklists.mjs

  validate:release-notes:
    desc: Validate companion release notes against release metadata
    cmds:
      - node scripts/validate-release-notes.mjs

  build:
    desc: Validate checklist data and build the EFB app
    deps:
      - validate
    dir: "{{.APP_DIR}}"
    preconditions:
      - sh: test -d node_modules
        msg: Run "task install" before building the EFB app.
    cmds:
      - npm run rebuild

  watch:
    desc: Watch and rebuild the EFB app during development
    deps:
      - validate
    dir: "{{.APP_DIR}}"
    preconditions:
      - sh: test -d node_modules
        msg: Run "task install" before starting watch mode.
    cmds:
      - npm run watch

  test:app:
    desc: Run the EFB app unit tests
    dir: "{{.APP_DIR}}"
    cmds:
      - npm test

  audio:render-completion:
    desc: Render the clean Brian completion clip (explicit paid ElevenLabs operation)
    cmds:
      - node scripts/render-completion-audio.mjs {{.CLI_ARGS}}

  companion:build:
    desc: Build the Windows companion app and transport probe with the pinned .NET SDK
    deps:
      - validate:release-notes
    cmds:
      - >-
        docker run --rm
        --user "{{.HOST_UID}}:{{.HOST_GID}}"
        --env DOTNET_CLI_HOME=/tmp/dotnet-home
        --env NUGET_PACKAGES=/tmp/nuget
        --env XDG_DATA_HOME=/tmp/avalonia-data
        --env AVALONIA_TELEMETRY_OPTOUT=1
        --volume "{{.ROOT_DIR}}:/src"
        --workdir /src
        "{{.DOTNET_SDK_IMAGE}}"
        dotnet build "{{.COMPANION_SOLUTION}}"
        --configuration Release
        --target Rebuild
        --nologo
        -p:InformationalVersion={{.COMPANION_VERSION}}

  companion:test:
    desc: Run the CommBus transport probe self-tests
    cmds:
      - >-
        docker run --rm
        --user "{{.HOST_UID}}:{{.HOST_GID}}"
        --env DOTNET_CLI_HOME=/tmp/dotnet-home
        --env NUGET_PACKAGES=/tmp/nuget
        --env XDG_DATA_HOME=/tmp/avalonia-data
        --env AVALONIA_TELEMETRY_OPTOUT=1
        --volume "{{.ROOT_DIR}}:/src"
        --workdir /src
        "{{.DOTNET_SDK_IMAGE}}"
        dotnet run
        --project "{{.COMPANION_PROBE_PROJECT}}"
        --configuration Release
        --no-build
        --no-restore
        --
        --self-test

  companion:deploy:
    desc: Build and deploy the companion app and transport probe to Windows staging
    deps:
      - companion:build
    cmds:
      - node scripts/deploy-companion-windows.mjs "{{.COMPANION_STAGING_DIR}}" "{{.MSFS_SDK_ROOT}}/SimConnect SDK/lib"

  deploy:
    desc: Build and deploy managed inputs to the Windows MSFS staging
    deps:
      - build
    cmds:
      - node scripts/release-package.mjs validate-version
      - node scripts/deploy-windows.mjs "{{.STAGING_DIR}}"

  test:release:
    desc: Test the release packaging and installation utilities
    cmds:
      - node --test scripts/release-package.test.mjs

  release:deploy:
    internal: true
    env:
      MINIFY: "true"
      SOURCE_MAPS: "false"
      TYPECHECKING: "true"
      VR_CHECKLIST_VERSION: "{{.PROJECT_VERSION}}"
    cmds:
      - task deploy

  release:companion-deploy:
    internal: true
    env:
      VR_CHECKLIST_VERSION: "{{.PROJECT_VERSION}}"
    cmds:
      - task companion:deploy

  release:
    desc: Build the production package declared in VERSION
    env:
      VR_CHECKLIST_RELEASE_VERSION: "{{.PROJECT_VERSION}}"
      VR_CHECKLIST_RELEASE_STAGING_DIR: "{{.STAGING_DIR}}"
      VR_CHECKLIST_RELEASE_COMPANION_STAGING_DIR: "{{.COMPANION_STAGING_DIR}}"
      VR_CHECKLIST_RELEASE_OUTPUT_DIR: "{{.RELEASE_DIR}}"
      VR_CHECKLIST_RELEASE_SDK_ROOT: "{{.MSFS_SDK_ROOT}}"
    cmds:
      - node scripts/release-package.mjs validate-version
      - task: test:release
      - task: release:deploy
      - task: release:companion-deploy
      - task: companion:test
      - node scripts/release-package.mjs build

  community:install:
    desc: Link the current or specified release into Community2024
    env:
      VR_CHECKLIST_RELEASE_VERSION: '{{default .PROJECT_VERSION .VERSION}}'
      VR_CHECKLIST_RELEASE_OUTPUT_DIR: "{{.RELEASE_DIR}}"
      VR_CHECKLIST_RELEASE_COMMUNITY_DIR: "{{.COMMUNITY_DIR}}"
    cmds:
      - node scripts/release-package.mjs install

  companion:install:
    desc: Install the companion EXE from the current or specified release
    env:
      VR_CHECKLIST_RELEASE_VERSION: '{{default .PROJECT_VERSION .VERSION}}'
      VR_CHECKLIST_RELEASE_OUTPUT_DIR: "{{.RELEASE_DIR}}"
      VR_CHECKLIST_RELEASE_COMPANION_INSTALL_DIR: "{{.COMPANION_INSTALL_DIR}}"
      VR_CHECKLIST_RELEASE_SIMCONNECT_DIR: "{{.MSFS_SDK_ROOT}}/SimConnect SDK/lib"
    cmds:
      - node scripts/release-package.mjs install-companion

  release:install:
    desc: Install the MSFS package and companion EXE from a release
    cmds:
      - task: community:install
        vars:
          VERSION: '{{default .PROJECT_VERSION .VERSION}}'
      - task: companion:install
        vars:
          VERSION: '{{default .PROJECT_VERSION .VERSION}}'

  check:
    desc: Run the complete local validation and build
    cmds:
      - task: build
      - task: test:app
      - task: companion:build
      - task: companion:test
      - task: test:release
